<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Questionnaire</title>
	<style>
		.hidden {
			display: none;
		}

		.div {
			-moz-hyphens: auto;
			-webkit-hyphens: auto;
			-ms-hyphens: auto;
		}

		.form-container {
			background: #fff;
			margin: 0 auto;
			text-align: left;
			width: 640px;
		}

		.form-anketa {
			font-family: sans-serif;
			font-size: 14px;
			margin: 20px 20px 0;
			padding: 0 0 20px;
		}

		.flex {
			display: flex;
		}

		.flex-column {
			flex-direction: column;
		}

		.flex-wrap {
			flex-wrap: wrap;
		}

		.flex-basic-100 {
			flex-basis: 100%;
		}

		.flex-basic-50 {
			flex-basis: 50%;
		}

		.flex-basic-13 {
			flex-basis: 13%;
		}

		.flex-basic-9 {
			flex-basis: 9%;
		}

		.align-items-center {
			align-items: center;
		}

		.justify-content-between {
			justify-content: space-between;
		}

		.question-title {
			padding-bottom: 5px;
			margin: 0;
		}

		.font-weight-bold {
			font-weight: 700;
		}

		.margin-bottom-20 {
			margin-bottom: 20px;
		}

		.margin-bottom-5 {
			margin-bottom: 5px;
		}

		.padding-5 {
			padding: 5px;
		}

		.anketa {
			border-bottom: 1px dotted #ccc;
			margin-bottom: 16px;
			padding: 0 5px;
		}

		.anketa h2 {
			font-size: 22px;
			font-weight: 400;
			margin: 0 0 5px;
		}

		.choice {
			line-height: 20px;
			width: 75%;
		}

		.checkbox {
			margin: 0 20px 0 10px;
		}

		.button-submit,
		.button-previous,
		.button-send {
			border: 2px solid #d9a520;
			border-radius: 10px;
			background-color: #e7c15e;
			padding: 10px;
			font-size: 16px;
		}

		.button-submit:hover {
			background-color: #e1b032;
		}
	</style>
</head>

<body>

	<!-- Вопрос 1 -->
	<div class="flex flex-wrap margin-bottom-20 padding-5" style="width:50%; margin:auto;">
		<!-- Заголовок вопроса -->
		<h2>Вы проживаете в Преображенском?</h2>
		<!-- Радиокнопка для выбора "Да" -->
		<label>
			<input type="radio" name="question1" value="red" onclick="Show('redSection'); Hide('blueSection');">
			Да
		</label>
		<!-- Радиокнопка для выбора "Нет" -->
		<label>
			<input type="radio" name="question1" value="blue" onclick="Show('blueSection'); Hide('redSection');">
			Нет
		</label>
	</div>

	<!-- Вопрос 2 для жителей Преображенского -->
	<div class="flex flex-wrap margin-bottom-20 padding-5 hidden" style="width:50%; margin:auto;">
		<h2>Для Преображенского доп вопрос:</h2>
		<!-- Варианты ответов -->
		<label>
			<input type="radio" name="question2" value="3" onclick="Show('catSection'); Hide('dogSection');">
			3
		</label>
		<label>
			<input type="radio" name="question2" value="2" onclick="Show('dogSection'); Hide('catSection');">
			2
		</label>
		<label>
			<input type="radio" name="question2" value="1" onclick="Hide('catSection'); Hide('dogSection');">
			1
		</label>
	</div>

	<!-- Вопрос 3 для тех, кто не проживает в Преображенском -->
	<div class="flex flex-wrap margin-bottom-20 padding-5 hidden" style="width:50%; margin:auto;">
		<h2>Не для жителей Преображенского:</h2>
		<!-- Поле ввода текста -->
		<input id="_6a030c84-a24d-11ef-8503-0025903468f4" class="text small" type="text" maxlength="255" value="">
	</div>

	<!-- Вопрос с вариантами для всех пользователей -->
	<div class="flex flex-wrap margin-bottom-20 padding-5 hidden" style="width:50%; margin:auto;">
		<h2>Вопрос с вариантами:</h2>
		<!-- Вариант ответа, доступный всем -->
		<label>
			<input type="radio" name="question2" value="Этот вариант показан всем"
				onclick="Show('catSection'); Hide('dogSection');">
			Этот вариант показан всем
		</label>
		<!-- Вариант ответа только для жителей Тобольска -->
		<label>
			<input type="radio" name="question2" value="Этот вариант показывается только жителям Тобольска"
				onclick="Show('dogSection'); Hide('catSection');">
			Этот вариант показывается только жителям Тобольска
		</label>
	</div>

	<!-- Вывод блоков с вариантами ответа -->
	<div class="flex flex-wrap margin-bottom-20 padding-5" style="width:50%; margin:auto;">
		<div class="question-title font-weight-bold flex-basic-100"></div>
		<!-- Вариант ответа для всех -->
		<div class="flex justify-content-between flex-basic-50 align-items-center margin-bottom-5">
			<label class="choice">Этот вариант показан всем</label>
			<input id="_3b180525-b2a8-11ef-8503-0025903468f4" class="checkbox" type="radio"
				name="_61533b17-b2a8-11ef-8503-0025903468f4" typeofvalue="Справочник.ВариантыОтветовАнкет" onclick="">
		</div>
		<!-- Вариант ответа только для жителей Тобольска -->
		<div class="__af6641c0-9da1-11ef-84ff-0025903468f4 flex justify-content-between flex-basic-50 align-items-center margin-bottom-5"
			style="display:none;">
			<label class="choice">Этот вариант показывается только жителям Тобольска</label>
			<input id="_50ce3ce8-b2a8-11ef-8503-0025903468f4" class="checkbox" type="radio"
				name="_61533b17-b2a8-11ef-8503-0025903468f4" typeofvalue="Справочник.ВариантыОтветовАнкет" onclick="">
		</div>
	</div>

	<!-- Кнопки навигации -->
	<div style="width:50%; margin:20px auto;" class="flex justify-content-between">
		<!-- Кнопка "Предыдущий" (по умолчанию скрыта) -->
		<button class="button-previous hidden">Предыдущий</button>
		<!-- Кнопка "Далее" -->
		<button class="button-submit">Далее</button>
		<!-- Кнопка "Отправить" (появляется на последнем шаге) -->
		<button class="button-send hidden">Отправить</button>
	</div>

	<script>
		// Отправка данных JSON на сервер
		function sendJSON() {
			// с помощью jQuery обращаемся к элементам на странице по их именам
			let questions = [];
			// Подготовка вопросов с вариантами ответов
			questions.push({ question: '_84c4f1a5-a24c-11ef-8503-0025903468f4', answers: ['_78ceb817-a24c-11ef-8503-0025903468f4', '_7c1e0560-a24c-11ef-8503-0025903468f4'] });
			questions.push({ question: '_43f4c528-a24d-11ef-8503-0025903468f4', answers: ['_a3c82231-a24c-11ef-8503-0025903468f4', '_a3c82631-a24c-11ef-8503-0025903468f4', '_a75d2e0f-a24c-11ef-8503-0025903468f4'] });
			questions.push({ question: '_6a030c84-a24d-11ef-8503-0025903468f4', answers: ['_6a030c84-a24d-11ef-8503-0025903468f4'] });
			questions.push({ question: '_61533b17-b2a8-11ef-8503-0025903468f4', answers: ['_3b180525-b2a8-11ef-8503-0025903468f4', '_50ce3ce8-b2a8-11ef-8503-0025903468f4'] });


			// а вот сюда мы поместим ответ от сервера
			let result = document.querySelector('.result');
			// создаём новый экземпляр запроса XHR
			let xhr = new XMLHttpRequest();
			// адрес, куда мы отправим нашу JSON-строку
			let url = 'https://cons1.4dev.app/api/hs/extint/contract_anketa?type=post&contract=b158d735-7ca4-11ef-a5cc-ac1f6b476fd3';
			// открываем соединение
			xhr.open('POST', url, true);
			// устанавливаем заголовок — выбираем тип контента, который отправится на сервер, в нашем случае мы явно пишем, что это JSON
			xhr.setRequestHeader('Content-Type', 'application/json');
			// когда придёт ответ на наше обращение к серверу, мы его обработаем здесь
			xhr.onreadystatechange = function () {
				// если запрос принят и сервер ответил, что всё в порядке
				if (xhr.readyState === 4) {
					// выводим то, что ответил нам сервер — так мы убедимся, что данные он получил правильно
					result.innerHTML = this.responseText;
				}
			};
			// преобразуем наши данные JSON в строку
			var data = [];
			for (var i = 0; i < questions.length; i++) {
				var answers = questions[i].answers, selected = [];
				for (var j = 0; j < answers.length; j++) {
					var tag = document.querySelector('#' + answers[j]);
					if (answers[j].indexOf('_true') != -1 && tag.checked)
						selected.push({ 'value': true });
					else
						if (answers[j].indexOf('_false') != -1 && tag.checked)
							selected.push({ 'value': false });
						else
							if (tag.className == 'checkbox') {
								if (tag.checked) {
									if (tag.getAttribute('OpenAnswer') != null)
										selected.push({ 'link': answers[j].slice(1), 'typeofvalue': tag.getAttribute('typeofvalue'), 'openanswer': document.querySelector('#' + answers[j] + '_OpenAnswer').value });
									else
										selected.push({ 'link': answers[j].slice(1), 'typeofvalue': tag.getAttribute('typeofvalue') });
								}
							}
							else
								if (tag.className == 'flex-basic-13') {
									if (tag.checked)
										selected.push({ 'link': answers[j].slice(1), 'typeofvalue': tag.getAttribute('typeofvalue'), 'numstr': true });
								}
								else
									if (tag.value != '')
										selected.push({ 'value': tag.value });
				}
				if (selected.length == 0)
					continue;
				else {
					var name = questions[i].question.slice(1);
					data.push({ name, selected });
				}
			}
			// Преобразуем данные в JSON-строку и отправляем
			var Json = JSON.stringify({ 'template': '2de94097-a24c-11ef-8503-0025903468f4', 'data': data });
			// когда всё готово, отправляем JSON на сервер
			xhr.send(Json);
		}

		// Переменная для текущего индекса вопроса
		let currentQuestionIndex = 0;

		// Получаем элементы всех вопросов
		const questions = document.querySelectorAll('.flex.flex-wrap.margin-bottom-20.padding-5');

		// Получаем кнопки для навигации
		const prevButton = document.querySelector('.button-previous');
		const nextButton = document.querySelector('.button-submit');
		const question1Radio = document.querySelectorAll('input[name="question1"]'); // Get question 1 radio buttons
		const question2Container = document.querySelector('.flex.flex-wrap.margin-bottom-20.padding-5:nth-child(2)'); // Second question container
		const question3Container = document.querySelector('.flex.flex-wrap.margin-bottom-20.padding-5:nth-child(3)'); // Third question container
		const question4Container = document.querySelector('.flex.flex-wrap.margin-bottom-20.padding-5:nth-child(4)'); // Fourth question container

		// Показать элемент по ID
		function Show(id) {
			const element = document.getElementById(id);
			if (element) {
				element.classList.remove('hidden');
			}
		}

		// Скрыть элемент по ID
		function Hide(id) {
			const element = document.getElementById(id);
			if (element) {
				element.classList.add('hidden');
			}
		}

		const sendButton = document.querySelector('.button-send');

		// Переход к предыдущему вопросу
		function showPreviousQuestion() {
			questions.forEach((question) => {
				question.style.display = 'none';
			});

			// Логика перехода для разных состояний
			if (currentQuestionIndex === 1 || currentQuestionIndex === 2) {
				currentQuestionIndex = 0;
			} else if (currentQuestionIndex === 3) {
				const selectedAnswer = document.querySelector('input[name="question1"]:checked');
				currentQuestionIndex = selectedAnswer && selectedAnswer.value === 'blue' ? 2 : 1; // Выбор предыдущего вопроса в зависимости от ответа
			}

			questions[currentQuestionIndex].style.display = 'block'; // Отображаем текущий вопрос
			prevButton.classList.toggle('hidden', currentQuestionIndex === 0);
			nextButton.classList.toggle('hidden', currentQuestionIndex === 3);
			sendButton.classList.add('hidden'); // Скрываем кнопку отправки
		}


		// Переход к следующему вопросу
		function showNextQuestion() {
			if (currentQuestionIndex === 0) {
				const selectedAnswer = document.querySelector('input[name="question1"]:checked');
				if (selectedAnswer) {
					currentQuestionIndex = selectedAnswer.value === 'blue' ? 2 : 1; // Выбор следующего вопроса в зависимости от ответа
				}
			} else if (currentQuestionIndex === 1) {
				currentQuestionIndex = 3; // Переход на последний вопрос
			} else {
				currentQuestionIndex++;
			}

			questions.forEach((question, index) => {
				question.style.display = index === currentQuestionIndex ? 'block' : 'none'; // Показываем текущий вопрос
			});

			prevButton.classList.remove('hidden'); // Показываем кнопку "Предыдущий"
			nextButton.classList.toggle('hidden', currentQuestionIndex === 3);
			sendButton.classList.toggle('hidden', currentQuestionIndex !== 3);
		}

		// Начальная настройка: показываем только первый вопрос
		questions.forEach((question, index) => {
			question.style.display = index === 0 ? 'block' : 'none';
		});

		// Навешиваем обработчики событий на кнопки
		prevButton.addEventListener('click', showPreviousQuestion);
		nextButton.addEventListener('click', showNextQuestion);

		// Добавляем обработчик события "change" для каждой радиокнопки первого вопроса
		question1Radio.forEach((radio) => {
			// При изменении состояния радиокнопки (например, пользователь выбирает "Да" или "Нет")
			radio.addEventListener('change', function () {
				// На этом этапе ничего не происходит
				// Переход к следующему вопросу произойдет только при нажатии кнопки "Далее"
				// Это позволяет сначала выбрать ответ, а затем подтвердить его действием
			});
		});
	</script>
</body>

</html>
