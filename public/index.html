<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="stylesheet" href="./font/stylesheet.css">
    <title>React App</title>
    <style>
      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        width: 100vw;
        height: 100vh;
        background: rgba(255, 255, 255, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;  
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 6px solid #eee;
        border-top: 6px solid #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="preloader">
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <!--

    -->
    <button
      id="scrollAction"
      style="display: none"
      onclick="scrollClick(this)"
    ></button>
    <button
      id="scrollAction_filter"
      style="display: none"
      onclick="scrollClickFilter(this)"
    ></button>
    <button
    id="scrollAction_spisok"
    style="display: none"
    onclick="scrollClickSpisok(this)"
  ></button>
    <button id="action_trigger_main" style="display: none">
      Interaction button container for actions
    </button>
    <button id="filter" style="display: none" onclick="filter(this)">
    </button>
  </body>
  <script>
    function scrollClick(e) {
      // console.log(e)
      console.log(e?.id);
      return(e?.id);
    }
    function scrollClickFilter(e) {
      // console.log(e)
      console.log(e?.id);
      return(e?.id);
    }
    function scrollClickSpisok(e) {
      console.log(e?.id);
      return e?.id;
    }
    function filter(e) {
      // console.log(e)
      console.log(e?.id);
      return(e?.id);
    }
  </script>
